services:
  - type: web
    name: furry-talking
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: furry-talking-db
          property: connectionString

databases:
  - name: furry-talking-db
    plan: free
